<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.6/babel.min.js"></script>
<script src="../../sdcd-fallback.js"></script>
<body style="margin:0;padding:16px;font-family:var(--sdcd-font);background:var(--sdcd-fond)">
<div id="root"></div>
<script type="text/babel">
(window.__sdcdReady||Promise.resolve()).then(()=>{
const NS = window[Object.keys(window).find(k=>/_[0-9a-fA-F]{6}$/.test(k)&&window[k]&&typeof window[k]==='object'&&window[k].Button)]||{};
const {Card, Tile, Badge, Table} = NS;
function Demo(){return <div style={{display:'flex',flexDirection:'column',gap:16}}>
  <div style={{display:'grid','--sdcd-cols':'minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)','--sdcd-cols-md':'repeat(2,minmax(0,1fr))',gap:16}}>
    <Card surTitre="Actualité" titre="Lancement du portail gouv.cd" description="Le point d’entrée unique des services publics en ligne." meta="12 août 2026"/>
    <Tile icon="ri-passport-line" titre="Demander un passeport" description="Démarche en ligne"/>
    <Tile icon="ri-scales-3-line" titre="Journal officiel" description="Textes consolidés"/>
  </div>
  <div style={{display:'flex',gap:8}}><Badge>Neutre</Badge><Badge ton="info">Info</Badge><Badge ton="succes">Publié</Badge><Badge ton="alerte">En révision</Badge><Badge ton="erreur">Abrogé</Badge><Badge ton="nouveau">Nouveau</Badge></div>
  <Table colonnes={["Texte","Nature","Date"]} lignes={[["Ordonnance n° 23/006","Ordonnance","13/01/2023"],["Loi n° 22/003","Loi","24/03/2022"]]}/>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
