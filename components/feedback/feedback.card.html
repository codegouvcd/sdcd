<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.6/babel.min.js"></script>
<script src="../../sdcd-fallback.js"></script>
<body style="margin:0;padding:0;font-family:var(--sdcd-font);background:var(--sdcd-fond)">
<div id="root"></div>
<script type="text/babel">
(window.__sdcdReady||Promise.resolve()).then(()=>{
const NS = window[Object.keys(window).find(k=>/_[0-9a-fA-F]{6}$/.test(k)&&window[k]&&typeof window[k]==='object'&&window[k].Button)]||{};
const {Alert, Notice, Loader} = NS;
function Demo(){return <div style={{display:'flex',flexDirection:'column',gap:14}}>
  <Notice onClose={()=>{}}>Le portail sera indisponible dimanche de 2 h à 4 h pour maintenance.</Notice>
  <div style={{display:'grid','--sdcd-cols':'minmax(0,1fr) minmax(0,1fr)',gap:12,padding:'0 16px'}}>
    <Alert type="info" titre="Information">Le délai moyen de traitement est de 5 jours ouvrés.</Alert>
    <Alert type="succes" titre="Demande transmise">Vous recevrez un accusé sous 48 h.</Alert>
    <Alert type="alerte" titre="Pièce manquante">Ajoutez une copie de votre acte de naissance.</Alert>
    <Alert type="erreur" titre="Échec de l’envoi" onClose={()=>{}}>Vérifiez votre connexion puis réessayez.</Alert>
  </div>
  <div style={{padding:'0 16px 16px'}}><Loader/></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script>
