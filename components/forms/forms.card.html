<!-- @dsCard group="Composants" viewport="700x330" subtitle="Input, Select, Checkbox, Radio, Toggle, SearchBar" name="Formulaires" -->
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.6/babel.min.js"></script>
<script src="../../sdcd-fallback.js"></script>
<body style="margin:0;padding:16px;font-family:var(--sdcd-font);background:var(--sdcd-fond)">
<div id="root"></div>
<script type="text/babel">
(window.__sdcdReady||Promise.resolve()).then(()=>{
const NS = window[Object.keys(window).find(k=>/_[0-9a-fA-F]{6}$/.test(k)&&window[k]&&typeof window[k]==='object'&&window[k].Button)]||{};
const {Input, Select, Checkbox, Radio, Toggle, SearchBar} = NS;
function Demo(){return <div style={{display:'grid','--sdcd-cols':'minmax(0,1fr) minmax(0,1fr)',gap:'16px 24px'}}>
  <Input label="Numéro national" hint="Format : 12 chiffres" placeholder="000 000 000 000"/>
  <Input label="Adresse électronique" error="Ce champ est requis."/>
  <Select label="Province" options={["Kinshasa","Haut-Katanga","Nord-Kivu","Kongo-Central"]}/>
  <div style={{display:'flex',flexDirection:'column',gap:10}}>
    <Checkbox label="J’accepte les conditions d’utilisation" defaultChecked/>
    <div style={{display:'flex',gap:16}}><Radio name="l" label="Français" defaultChecked/><Radio name="l" label="English"/></div>
    <Toggle label="Recevoir les notifications" defaultChecked/>
  </div>
  <div style={{gridColumn:'1 / -1'}}><SearchBar large/></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script>
