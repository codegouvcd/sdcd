<link rel="stylesheet" href="../../styles.css">
<script src="../../image-slot.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.6/babel.min.js"></script>
<script src="../../sdcd-fallback.js"></script>
<body style="margin:0;padding:16px;font-family:var(--sdcd-font);background:var(--sdcd-fond)">
<div id="root"></div>
<script type="text/babel">
(window.__sdcdReady||Promise.resolve()).then(()=>{
const NS = window[Object.keys(window).find(k=>/_[0-9a-fA-F]{6}$/.test(k)&&window[k]&&typeof window[k]==='object'&&window[k].Button)]||{};
const {Carousel, Gallery, MediaPlayer, TagCloud} = NS;
function Demo(){return <div style={{display:'grid','--sdcd-cols':'minmax(0,1.2fr) minmax(0,1fr)',gap:'clamp(15px,3.5vw,28px)'}}>
  <div style={{display:'flex',flexDirection:'column',gap:22}}>
    <Carousel legende={["Palais de la Nation, Kinshasa","Chutes de la Lofoï","Fleuve Congo à Kisangani"]}>
      <div style={{height:240}}><image-slot id="car-1" shape="rect" placeholder="Diapositive 1"></image-slot></div>
      <div style={{height:240}}><image-slot id="car-2" shape="rect" placeholder="Diapositive 2"></image-slot></div>
      <div style={{height:240}}><image-slot id="car-3" shape="rect" placeholder="Diapositive 3"></image-slot></div>
    </Carousel>
    <TagCloud tags={[{label:"Passeport",poids:124},{label:"Impôts",poids:87},{label:"État civil",poids:64},{label:"Permis",poids:41},{label:"Entreprise",poids:38},{label:"Santé",poids:22},{label:"Visa",poids:17},{label:"Éducation",poids:9}]}/>
  </div>
  <div style={{display:'flex',flexDirection:'column',gap:22}}>
    <MediaPlayer titre="Adresse à la Nation — fête de l’indépendance" duree="12:36" poster={<image-slot id="mp-1" shape="rect" placeholder="Vignette vidéo"></image-slot>}/>
    <Gallery colonnes={3} items={[{contenu:<image-slot id="ga-1" shape="rect" placeholder="1"></image-slot>,legende:"Assemblée nationale"},{contenu:<image-slot id="ga-2" shape="rect" placeholder="2"></image-slot>,legende:"Port de Matadi"},{contenu:<image-slot id="ga-3" shape="rect" placeholder="3"></image-slot>,legende:"Kinshasa"}]}/>
  </div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script>
